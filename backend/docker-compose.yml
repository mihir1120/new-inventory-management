services:
  postgres:
    image: postgres:17
    container_name: ashokvatika-postgres
    environment:
      POSTGRES_DB: ashokvatika
      POSTGRES_USER: ashokvatika
      POSTGRES_PASSWORD: ashokvatika
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ashokvatika_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ashokvatika -d ashokvatika"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ashokvatika_postgres:
